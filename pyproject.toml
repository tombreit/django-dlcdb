[project]
name = "dlcdb"
dynamic = ["version"]
description = "Device Live Cycle Database"
authors = [{name = "Thomas Breitner", email = "t.breitner@csl.mpg.de"},]
license = "EUPL-1.2"
license-files = ["LICENSE", "LICENSES/*.txt"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Topic :: Documentation",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "Django==6.1.1",
    "django-environ",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "django-simple-history",
    "django-htmx",
    "whitenoise",
    "huey",
    "openpyxl",
    "markdown",
    "Pillow",
    "segno",
    "djangorestframework",
    "drf-spectacular",
    "django-filter",
    "icalendar",
    "plotly",
]

[project.scripts]
dlcdb = "dlcdb.__main__:main"

[project.optional-dependencies]
# Builds the in-app docs (`make docs`). A wheel already contains them, so only
# source checkouts and the release build need this extra.
docs = [
    "Sphinx",
    "pydata-sphinx-theme",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-openapi",
    "myst_parser",  # currently not working: myst_parser[linkify]
    "sphinx-design",
    "sphinx-togglebutton",
    # "roman-numerals-py",
]
ldap = [
    "django-auth-ldap",
]
# Only the container image serves via gunicorn; the Apache/mod_wsgi deployment
# must not grow that dependency, hence a separate extra.
container = [
    "gunicorn",
]
dev = [
    "pre-commit",
    "ruff",
    "pytest>=9",
    "pytest-django",
    "pytest-cov",
    "pip-tools",
    "django-auth-ldap",
    "Faker",
    # "django-debug-toolbar<6",  # As v6 introduced a db migration: https://github.com/django-commons/django-debug-toolbar/issues/2168
    "django-debug-toolbar",
    "django_extensions",
    "django-upgrade",
    # for js qr scanner https connections on localhost runserver:
    # see: https://github.com/django-extensions/django-extensions/issues/1475
    # "Werkzeug==0.16.1",
    # "pyOpenSSL",
]

[project.urls]
Homepage = "https://gitlab.gwdg.de/t.breitner/django-dlcdb"
Documentation = "https://gitlab.gwdg.de/t.breitner/django-dlcdb/-/tree/main/docs"
Repository = "https://gitlab.gwdg.de/t.breitner/django-dlcdb"
Issues = "https://gitlab.gwdg.de/t.breitner/django-dlcdb/-/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "dlcdb.__version__"}

[tool.setuptools.packages.find]
include = ["dlcdb*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false

# Listed explicitly, because the frontend bundles (static/**/dist/) and the
# docs are gitignored build output. Before building the wheel, run
# `npm run build` and `make docs`, then copy run/docs/html to dlcdb/docs_html
# (on CI or in a scratch copy, not in the working tree).
[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "locale/**/*.mo"]
"dlcdb" = ["docs_html/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# TODO: Phase the following ignores out
ignore = [
    "RUF012",
    "C408",
    "BLE001",
    "DTZ001",
    "DTZ002",
    "DTZ011",
    "DTZ007",
    "DTZ005",
    "TRY401",
    "SIM102",
    "C400",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "dlcdb.settings.test"
testpaths = ["dlcdb"]
required_plugins = ["pytest-django"]
