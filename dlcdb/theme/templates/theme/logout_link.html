{% load i18n %}

{# https://docs.djangoproject.com/en/5.0/releases/4.1/#log-out-via-get #}

<form class="dropdown-item logout-form-link" method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">
      <i class="bi bi-box-arrow-right"></i>
      {% blocktranslate with username=request.user.username %}Logout {{ username }}{% endblocktranslate %}
    </button>
</form>
