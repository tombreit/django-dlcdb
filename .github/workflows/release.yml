# A pushed version tag (vX.Y.Z) builds the wheel and attaches it to a new
# GitHub release. The wheel carries the frontend bundles and the rendered docs,
# so installing it needs neither npm nor Sphinx.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          # The last one is the default and builds; the smoke test uses the
          # lowest version pyproject.toml allows.
          python-version: |
            3.12
            3.13

      - name: Tag matches the version
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'import dlcdb; print(dlcdb.__version__)')"
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - name: Frontend bundles
        run: |
          npm ci
          npm run build

      - name: Docs and static files, copied into the package
        run: |
          pip install -r requirements/prod.txt build
          make docs
          cp -r run/docs/html dlcdb/docs_html
          python manage.py collectstatic --noinput
          cp -r run/staticfiles dlcdb/staticfiles

      - name: Wheel
        run: python -m build --wheel

      - name: Smoke test in a fresh venv, on Python 3.12
        working-directory: ${{ runner.temp }}
        run: |
          python3.12 -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          test -f smoke/lib/python*/site-packages/dlcdb/staticfiles/staticfiles.json
          DLCDB_HOME="$RUNNER_TEMP/home" smoke/bin/python -m dlcdb dlcdb_init
          cd home
          ./manage.py check
          ./manage.py migrate --noinput
          ./manage.py shell --verbosity 0 --command "from django.test import Client; assert Client().get('/accounts/login/', HTTP_HOST='127.0.0.1').status_code == 200"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "DLCDB $GITHUB_REF_NAME" --generate-notes
