# A pushed version tag (vX.Y.Z) builds the wheel and attaches it to a new
# GitHub release. The wheel carries the frontend bundles and the rendered docs,
# so installing it needs neither npm nor Sphinx.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          # The last one is the default and builds; the smoke test uses the
          # lowest version pyproject.toml allows.
          python-version: |
            3.12
            3.13

      # The same target builds and tries a release locally (Makefile, `make wheel`)
      - name: Wheel, built from the tag and tried on Python 3.12
        run: |
          pip install -r requirements/prod.txt build
          make wheel TAG="$GITHUB_REF_NAME" SMOKE_PYTHON=python3.12

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" run/release/dist/*.whl --title "DLCDB $GITHUB_REF_NAME" --generate-notes
